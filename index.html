<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>My Grades</title>
<style>
  :root {
    --blue: #0a5282;
    --navy: #12304f;
    --navy-btn: #0d4a74;
    --teal: #4fbdd6;
    --text: #0d4a74;
    --muted: #4a5e72;
    --row-alt: #eeeeee;
    --bg: #ffffff;
    --page: #f2f2f2;
    --line: #d9d9d9;
    --red: #e25b5b;
    --g-a: #9ccd62;
    --g-b: #8ccbe0;
    --g-c: #f2d15c;
    --g-d: #f0a04b;
    --g-f: #c9452f;
    --present: #2fb84e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    padding-bottom: 84px;
    position: relative;
  }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid #f5b400; outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--blue); color: #fff;
    display: grid; grid-template-columns: 56px 1fr 56px; align-items: center;
    height: 60px;
  }
  .topbar h1 { margin: 0; text-align: center; font-size: 1.15rem; font-weight: 600; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { background: none; border: 0; color: #fff; width: 56px; height: 60px; display: grid; place-items: center; }
  .icon-btn svg { width: 26px; height: 26px; }

  /* Profile */
  .profile { background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; gap: 20px; padding: 8px 16px 18px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: #e7eef5; color: var(--blue); display: grid; place-items: center; font-weight: 700; font-size: 1.3rem; flex: none; object-fit: cover; }
  .profile .name { font-size: 1.25rem; text-transform: uppercase; text-align: center; line-height: 1.3; }

  /* Section buttons */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; padding: 10px 8px; border-bottom: 2px solid var(--line); }
  .tab { border: 1.5px solid var(--navy); background: #fff; color: var(--navy); border-radius: 7px; padding: 6px 4px; font-size: .95rem; }
  .tab[aria-current="page"] { background: var(--navy); color: #fff; }

  /* School card */
  .school { margin: 10px 6px 0; border-radius: 6px 6px 0 0; overflow: hidden; }
  .school-head { background: var(--navy); color: #fff; padding: 14px 18px; font-size: 1.1rem; text-transform: uppercase; }
  .school-sub { background: var(--blue); padding: 8px; display: flex; justify-content: center; }
  .info-btn { background: var(--teal); color: #fff; border: 0; border-radius: 3px; padding: 6px 40px; font-size: 1.05rem; }
  .session { display: grid; grid-template-columns: 82px 1fr auto; gap: 10px; align-items: center; padding: 10px 10px; border-bottom: 1px solid var(--line); width: 100%; background: #fff; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: var(--text); }
  .session.alt { background: var(--row-alt); }
  .session .lbl { font-style: italic; font-weight: 700; font-size: 1.05rem; }
  .session .what { color: var(--navy); font-size: .92rem; line-height: 1.4; }
  .session-link { grid-column: 1 / 3; display: grid; grid-template-columns: 82px 1fr; gap: 10px; align-items: center; background: none; border: 0; padding: 0; text-align: left; color: inherit; }
  .pill-p { background: var(--present); color: #fff; font-weight: 700; border: 0; border-radius: 4px; padding: 4px 9px; min-width: 32px; min-height: 32px; }
  .time { font-weight: 700; color: var(--navy); }

  /* Quarters */
  .quarters { display: flex; align-items: center; gap: 8px; padding: 12px 10px 4px 24px; flex-wrap: wrap; }
  .q { border: 1.5px solid var(--blue); background: #fff; color: var(--blue); border-radius: 6px; width: 40px; height: 40px; font-weight: 600; }
  .q[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .q-range { margin-left: 10px; font-size: .85rem; font-weight: 600; }

  .hint { padding: 14px 10px 4px; }
  .hint em { display: block; font-size: 1.1rem; padding-left: 18px; margin-bottom: 4px; }
  .hint p { margin: 0; font-size: .85rem; font-weight: 600; line-height: 1.5; }
  .day-toggle { background: none; border: 0; padding: 0; color: inherit; font-weight: 700; text-decoration: underline dotted; }

  .filter { display: flex; gap: 6px; padding: 8px 10px 0; }
  .chip { border: 1px solid var(--blue); color: var(--blue); background: #fff; border-radius: 999px; padding: 3px 12px; font-size: .82rem; }
  .chip[aria-pressed="true"] { background: var(--blue); color: #fff; }

  /* Course table */
  .thead { display: grid; grid-template-columns: 54px 48px 1fr auto; padding: 14px 16px 8px 20px; font-size: 1.15rem; font-weight: 600; }
  .thead span:last-child { padding-right: 24px; }
  .courses { list-style: none; margin: 0; padding: 0; }
  .course {
    display: grid; grid-template-columns: 54px 48px 1fr auto; align-items: center;
    width: 100%; text-align: left; border: 0; background: #fff; color: var(--text);
    padding: 12px 10px 12px 20px; min-height: 96px;
  }
  .courses li:nth-child(odd) .course { background: var(--row-alt); }
  .course:hover .c-name { text-decoration: underline; }
  .course .pd, .course .rot { font-size: 1.15rem; }
  .c-name { font-weight: 700; font-size: 1.05rem; text-transform: uppercase; color: var(--navy-btn); margin-bottom: 4px; }
  .c-status { color: var(--red); font-weight: 600; margin-bottom: 4px; }
  .c-teacher { font-style: italic; color: var(--muted); margin-bottom: 4px; }
  .c-att { color: var(--muted); }

  .badge { display: inline-block; border-radius: 7px; padding: 6px 10px; font-weight: 700; font-size: 1.05rem; color: #fff; white-space: nowrap; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
  .g-A { background: var(--g-a); }
  .g-B { background: var(--g-b); }
  .g-C { background: var(--g-c); color: #3d3300; text-shadow: none; }
  .g-D { background: var(--g-d); }
  .g-F { background: var(--g-f); }
  .g-NG { background: var(--blue); text-shadow: none; }

  /* Bottom nav */
  .bottomnav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 560px; background: #fff; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 20;
  }
  .bottomnav a { display: grid; place-items: center; height: 56px; color: #9aa3ab; text-decoration: none; font-size: .7rem; }
  .bottomnav a svg { width: 30px; height: 30px; }
  .bottomnav a[aria-current="page"] { color: var(--blue); }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(78vw, 300px); background: var(--navy); color: #fff; z-index: 31; padding: 16px 0; transform: translateX(-100%); transition: transform .2s; }
  .drawer.open { transform: none; }
  .drawer h2 { margin: 0 20px 12px; font-size: 1rem; opacity: .8; font-weight: 600; }
  .drawer a { display: block; padding: 14px 20px; color: #fff; text-decoration: none; font-size: 1.05rem; }
  .drawer a:hover, .drawer a:focus-visible { background: var(--blue); }
  @media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }

  /* Detail pages */
  .page { padding: 16px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; background: #fff; }
  .card h2 { margin: 0 0 12px; font-size: 1.05rem; color: var(--navy); }
  .hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .hero .badge { font-size: 1.6rem; padding: 10px 14px; }
  .hero .title { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; color: var(--navy); margin: 0 0 6px; }
  .meta { margin: 0; color: var(--muted); line-height: 1.6; }
  .qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .qcell { text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; }
  .qcell .ql { font-weight: 700; margin-bottom: 6px; }
  .qcell .badge { font-size: .9rem; padding: 4px 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { border-radius: 8px; padding: 10px; text-align: center; background: var(--row-alt); }
  .stat .num { font-size: 1.7rem; font-weight: 800; color: var(--navy); }
  .stat .lab { font-size: .85rem; color: var(--muted); }
  .stepper { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .stepper button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--blue); background: #fff; color: var(--blue); font-weight: 700; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  .field input, .field select { border: 1px solid #b9c3cc; border-radius: 6px; padding: 8px; min-width: 0; color: var(--navy); }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 6px; padding: 9px 14px; font-weight: 600; }
  .btn.ghost { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
  .btn.danger { background: #fff; color: var(--g-f); border: 1px solid var(--g-f); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .empty { color: var(--muted); font-style: italic; margin: 0; }
  .alert { background: #fdecea; border-left: 4px solid var(--g-f); padding: 10px 12px; border-radius: 6px; color: #7a2418; margin-bottom: 14px; }
  .bar { height: 8px; border-radius: 4px; background: #e3e7eb; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; }
  .linkrow { width: 100%; background: none; border: 0; text-align: left; color: inherit; padding: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .small { font-size: .85rem; color: var(--muted); }

  /* News */
  .news-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .news-item { display: grid; grid-template-columns: 40px auto 1fr; gap: 12px; align-items: center; background: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 4px rgba(0,0,0,.15); color: #1d2b44; }
  .news-item svg { width: 40px; height: 36px; }
  .news-item .n-title { font-size: 1.05rem; font-weight: 700; }
  .news-item .n-date { font-size: .9rem; white-space: nowrap; }
  .news-item .n-right { text-align: right; }
  .news-item .n-what { font-size: .9rem; }
  .news-item .n-course { font-size: .75rem; text-transform: uppercase; margin-top: 4px; }
  .news-item .n-mine { display: inline-block; margin-top: 4px; font-size: .72rem; color: var(--blue); border: 1px solid var(--blue); border-radius: 999px; padding: 1px 8px; }
  .news-item .n-del { background: none; border: 0; color: var(--g-f); font-size: .8rem; text-decoration: underline; padding: 4px 0 0; }
</style>
</head>

const KEY = "my-grades-v1";
let data = load();
let dayFilter = "all";
let showSOE = false;

function load() {
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
}

/* ---------- Helpers ---------- */
function letter(pct) {
  if (pct == null || isNaN(pct)) return "NG";
  if (pct >= 90) return "A";
  if (pct >= 87) return "B+";
  if (pct >= 80) return "B";
  if (pct >= 77) return "C+";
  if (pct >= 70) return "C";
  if (pct >= 67) return "D+";
  if (pct >= 60) return "D";
  return "F";
}
function badge(pct) {
  const l = letter(pct);
  const cls = "g-" + (l === "NG" ? "NG" : l[0]);
  const text = l === "NG" ? "NG" : `${Math.round(pct)}% ${l}`;
  const label = l === "NG" ? "No grade" : `${Math.round(pct)} percent, ${l.replace("+", " plus")}`;
  return `<span class="badge ${cls}" aria-label="${label}">${text}</span>`;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function pad(n) { return String(n).padStart(2, "0"); }
function byPd(pd) { return data.courses.find(c => c.pd === pd); }
function gradeOf(c, q = data.quarter) { return c.noGrade ? null : c.grades[q]; }

const view = document.getElementById("view");
const title = document.getElementById("pageTitle");

/* ---------- Pages ---------- */
function sectionTabs(active) {
  const tabs = [["courses", "Courses", "#/"], ["planner", "Planner", "#/planner"], ["news", "News", "#/news"],
                ["reports", "Reports", "#/reports"], ["tests", "Test History", "#/tests"], ["attendance", "Attendance", "#/attendance"]];
  return `<nav class="tabs" aria-label="Sections">${tabs.map(([k, l, h]) =>
    `<button class="tab" ${k === active ? 'aria-current="page"' : ""} onclick="location.hash='${h}'">${l}</button>`).join("")}</nav>`;
}

function profile() {
  return `<section class="profile" aria-label="Student">
    <img class="avatar" src="${PHOTO}" alt="">
    <div class="name">${esc(data.student.name)}</div>
  </section>`;
}

function homePage() {
  title.textContent = "Overview";
  const cur = byPd(data.inSession), nxt = byPd(data.next.pd);
  const shown = data.courses.filter(c => dayFilter === "all" || c.rot === dayFilter);
  const q = data.quarter;

  return `${profile()}${sectionTabs("courses")}
  <section class="school" aria-label="School">
    <div class="school-head">${esc(data.student.school)}</div>
    <div class="school-sub"><button class="info-btn" onclick="location.hash='#/settings'">My Info</button></div>
  </section>
  ${cur ? `<div class="session">
      <button class="session-link" onclick="location.hash='#/course/${cur.pd}'" aria-label="In session: ${esc(cur.name)}, room ${cur.room}">
        <span class="lbl">In Session</span>
        <span class="what">Room ${cur.room} - ${pad(cur.pd)} - ${cur.rot} - ${esc(cur.name)} - ${esc(cur.teacher)}</span>
      </button>
      <button class="pill-p" onclick="togglePill()" aria-label="${showSOE ? "SOE" : "Present"}. Tap to switch.">${showSOE ? "SOE" : "P"}</button>
    </div>` : ""}
  ${nxt ? `<button class="session alt" onclick="location.hash='#/course/${nxt.pd}'" aria-label="Next: ${esc(nxt.name)} at ${data.next.time}">
      <span class="lbl">Next</span>
      <span class="what">Room ${nxt.room} - ${pad(nxt.pd)} - ${nxt.rot} - ${esc(nxt.name)} - ${esc(nxt.teacher)}</span>
      <span class="time">${data.next.time}</span>
    </button>` : ""}
  <div class="quarters" role="group" aria-label="Quarter">
    ${["Q1", "Q2", "Q3", "Q4"].map(k => `<button class="q" aria-pressed="${k === q}" onclick="setQuarter('${k}')">${k}</button>`).join("")}
    <span class="q-range">${data.quarters[q] || "Not started yet"}</span>
  </div>
  <div class="hint">
    <em>Tap on course for more details</em>
    <p>Today is day <button class="day-toggle" onclick="toggleDay()" aria-label="Today is day ${data.today}. Tap to switch day.">${data.today}</button> on the rotation.</p>
    <p>Rotation Day A : A LUNCH</p>
    <p>Rotation Day B : B LUNCH</p>
  </div>
  <div class="filter" role="group" aria-label="Show courses">
    ${[["all", "All"], ["A", "Day A"], ["B", "Day B"]].map(([k, l]) =>
      `<button class="chip" aria-pressed="${dayFilter === k}" onclick="setFilter('${k}')">${l}</button>`).join("")}
  </div>
  <div class="thead" aria-hidden="true"><span>Pd</span><span>Rot</span><span>Course</span><span>Grade</span></div>
  <ul class="courses">
    ${shown.map(c => `<li><button class="course" onclick="location.hash='#/course/${c.pd}'"
        aria-label="Period ${c.pd}, day ${c.rot}, ${esc(c.name)}, ${esc(c.teacher)}. ${c.status ? c.status + ". " : ""}Excused ${c.ex}, unexcused ${c.unx}, tardy ${c.tardy}. Grade: ${letter(gradeOf(c)) === "NG" ? "no grade" : Math.round(gradeOf(c)) + " percent " + letter(gradeOf(c))}">
      <span class="pd">${pad(c.pd)}</span>
      <span class="rot">${c.rot}</span>
      <span>
        <div class="c-name">${esc(c.name)}</div>
        ${c.status ? `<div class="c-status">${esc(c.status)}</div>` : ""}
        <div class="c-teacher">${esc(c.teacher)} - ${c.room}</div>
        <div class="c-att">Ex: ${c.ex} | Unx: ${c.unx} | Tardy: ${c.tardy}</div>
      </span>
      <span aria-hidden="true">${badge(gradeOf(c))}</span>
    </button></li>`).join("")}
  </ul>`;
}

function coursePage(pd) {
  const c = byPd(pd);
  if (!c) return notFound();
  title.textContent = c.name.toUpperCase();
  const g = gradeOf(c);
  const graded = c.assignments.filter(a => a.possible > 0);
  const avg = graded.length ? graded.reduce((s, a) => s + a.earned, 0) / graded.reduce((s, a) => s + a.possible, 0) * 100 : null;

  return `<div class="page">
    <button class="btn ghost" onclick="history.length > 1 ? history.back() : location.hash='#/'" style="margin-bottom:14px">&larr; Back</button>
    ${letter(g) === "F" || letter(g) === "D" || letter(g) === "D+" ? `<div class="alert" role="note"><strong>Heads up:</strong> this class is below a C. Logging assignments below can help you see what to focus on.</div>` : ""}
    <section class="card hero" aria-label="Course summary">
      <div>
        <p class="title">${esc(c.name)}</p>
        ${c.status ? `<div class="c-status">${esc(c.status)}</div>` : ""}
        <p class="meta">${esc(c.teacher)}<br>Room ${c.room}<br>Period ${pad(c.pd)} &middot; Day ${c.rot}</p>
      </div>
      ${badge(g)}
    </section>

    <section class="card" aria-labelledby="qh">
      <h2 id="qh">Quarter grades</h2>
      <div class="qgrid">
        ${["Q1", "Q2", "Q3", "Q4"].map(q => `<div class="qcell"><div class="ql">${q}</div>${badge(gradeOf(c, q))}</div>`).join("")}
      </div>
      ${c.noGrade ? `<p class="small" style="margin-top:10px">This class doesn't get a grade (NG).</p>` : `
      <form class="row" style="margin-top:14px" data-action="setGrade" data-pd="${c.pd}">
        <label class="field">Quarter
          <select name="q">${["Q1", "Q2", "Q3", "Q4"].map(q => `<option ${q === data.quarter ? "selected" : ""}>${q}</option>`).join("")}</select>
        </label>
        <label class="field">Grade %
          <input name="pct" type="number" min="0" max="110" step="0.1" required style="width:90px" value="${g ?? ""}">
        </label>
        <button type="button" class="btn" onclick="submitForm(this.form)">Update grade</button>
      </form>`}
    </section>

    <section class="card" aria-labelledby="ah">
      <h2 id="ah">Attendance</h2>
      <div class="stats">
        ${[["ex", "Excused"], ["unx", "Unexcused"], ["tardy", "Tardy"]].map(([k, l]) => `
          <div class="stat">
            <div class="num" aria-live="polite">${c[k]}</div>
            <div class="lab">${l}</div>
            <div class="stepper">
              <button aria-label="Remove one ${l.toLowerCase()}" onclick="bump(${c.pd}, '${k}', -1)">&minus;</button>
              <button aria-label="Add one ${l.toLowerCase()}" onclick="bump(${c.pd}, '${k}', 1)">+</button>
            </div>
          </div>`).join("")}
      </div>
    </section>

    <section class="card" aria-labelledby="sh">
      <h2 id="sh">My assignments</h2>
      ${avg != null ? `<p class="small" style="margin-top:-6px">Average of what you've logged: <strong>${avg.toFixed(1)}% ${letter(avg)}</strong></p>` : ""}
      ${c.assignments.length ? `<ul class="list">${c.assignments.map((a, i) => `
        <li>
          <span><strong>${esc(a.name)}</strong><br><span class="small">${a.earned}/${a.possible}</span></span>
          <span style="display:flex;gap:8px;align-items:center">${badge(a.earned / a.possible * 100)}
            <button class="btn danger" aria-label="Delete ${esc(a.name)}" onclick="delAssignment(${c.pd}, ${i})">&times;</button></span>
        </li>`).join("")}</ul>` : `<p class="empty">No assignments logged yet.</p>`}
      <form class="row" style="margin-top:14px" data-action="addAssignment" data-pd="${c.pd}">
        <label class="field" style="flex:1 1 140px">Assignment
          <input name="name" required placeholder="e.g. Unit 2 test">
        </label>
        <label class="field">Points
          <input name="earned" type="number" min="0" step="0.1" required style="width:70px">
        </label>
        <label class="field">Out of
          <input name="possible" type="number" min="1" step="0.1" required style="width:70px">
        </label>
        <button type="button" class="btn" onclick="submitForm(this.form)">Add</button>
      </form>
    </section>
  </div>`;
}

function attendancePage() {
  title.textContent = "Attendance";
  const t = data.courses.reduce((s, c) => ({ ex: s.ex + c.ex, unx: s.unx + c.unx, tardy: s.tardy + c.tardy }), { ex: 0, unx: 0, tardy: 0 });
  const max = Math.max(1, ...data.courses.map(c => c.ex + c.unx + c.tardy));
  return `${profile()}${sectionTabs("attendance")}<div class="page">
    <section class="card" aria-labelledby="th">
      <h2 id="th">Totals (all classes)</h2>
      <div class="stats">
        <div class="stat"><div class="num">${t.ex}</div><div class="lab">Excused</div></div>
        <div class="stat"><div class="num">${t.unx}</div><div class="lab">Unexcused</div></div>
        <div class="stat"><div class="num">${t.tardy}</div><div class="lab">Tardy</div></div>
      </div>
    </section>
    <section class="card" aria-labelledby="bh">
      <h2 id="bh">By class</h2>
      <p class="small" style="margin-top:-6px">Tap a class to add or remove absences.</p>
      <ul class="list">${data.courses.map(c => `<li>
        <button class="linkrow" onclick="location.hash='#/course/${c.pd}'">
          <span style="flex:1">
            <strong>${pad(c.pd)} &middot; ${esc(c.name)}</strong><br>
            <span class="small">Ex: ${c.ex} | Unx: ${c.unx} | Tardy: ${c.tardy}</span>
            <div class="bar" aria-hidden="true" style="width:100%">
              <span style="width:${(c.ex + c.unx + c.tardy) / max * 100}%;background:linear-gradient(90deg,var(--g-b) 0 ${c.ex / Math.max(1, c.ex + c.unx + c.tardy) * 100}%,var(--g-f) 0 ${(c.ex + c.unx) / Math.max(1, c.ex + c.unx + c.tardy) * 100}%,var(--g-d) 0)"></span>
            </div>
          </span>
          <span aria-hidden="true">&rsaquo;</span>
        </button></li>`).join("")}</ul>
      <p class="small" style="margin-bottom:0">Bar colors: <span style="color:#3a8fae">blue = excused</span>, <span style="color:var(--g-f)">red = unexcused</span>, <span style="color:#b86a12">orange = tardy</span>.</p>
    </section>
  </div>`;
}

function placeholderPage(key, name) {
  title.textContent = name;
  return `${profile()}${sectionTabs(key)}<div class="page">
    <section class="card"><h2>${name}</h2><p class="empty">This page is set up and ready. Tell me what you want here and I'll add it.</p></section>
  </div>`;
}

function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}
function todayISO() {
  const t = new Date();
  return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
}

function newsPage() {
  title.textContent = "News";
  const mine = (data.myNews || []).map((n, i) => ({ ...n, mine: true, i }));
  const items = [...NEWS, ...mine].sort((a, b) => b.date.localeCompare(a.date));
  const warn = `<svg viewBox="0 0 52 46" aria-hidden="true"><path d="M22.5 3a4 4 0 0 1 7 0l21 37a4 4 0 0 1-3.5 6H5a4 4 0 0 1-3.5-6z" fill="#de8443"/><rect x="23" y="12" width="6" height="19" rx="3" fill="#fff"/><circle cx="26" cy="37" r="3.3" fill="#fff"/></svg>`;
  return `${profile()}${sectionTabs("news")}<div class="page">
    <ul class="news-list">${items.map(n => `<li class="news-item">
      ${warn}
      <div><div class="n-title">${esc(n.type)}</div><div class="n-date">${fmtDate(n.date)}</div>
        ${n.mine ? `<span class="n-mine">Logged by me</span>` : ""}</div>
      <div class="n-right"><div class="n-what">${esc(n.what)}</div><div class="n-course">${esc(n.course)}</div>
        ${n.mine ? `<button class="n-del" onclick="delNews(${n.i})" aria-label="Delete ${esc(n.what)} on ${fmtDate(n.date)}">Delete</button>` : ""}</div>
    </li>`).join("")}</ul>

    <section class="card" style="margin-top:16px" aria-labelledby="logh">
      <h2 id="logh">Log an attendance event</h2>
      <form data-action="addNews">
        <div class="row">
          <label class="field">Date <input name="date" type="date" required value="${todayISO()}"></label>
          <label class="field" style="flex:1 1 180px">What happened
            <select name="what">${EVENT_TYPES.map(t => `<option>${t}</option>`).join("")}</select>
          </label>
          <label class="field" style="flex:1 1 180px">Class
            <select name="course">${data.courses.map(c => `<option>${esc(c.name)}</option>`).join("")}</select>
          </label>
        </div>
        <button type="button" class="btn" style="margin-top:12px" onclick="submitForm(this.form)">Add to News</button>
      </form>
    </section>
  </div>`;
}

function settingsPage() {
  title.textContent = "My Info";
  return `<div class="page">
    <section class="card">
      <h2>My info</h2>
      <form data-action="saveInfo">
        <div class="row">
          <label class="field" style="flex:1 1 200px">Name <input name="name" value="${esc(data.student.name)}" required></label>
          <label class="field" style="flex:1 1 200px">School <input name="school" value="${esc(data.student.school)}" required></label>
        </div>
        <button type="button" class="btn" style="margin-top:12px" onclick="submitForm(this.form)">Save</button>
      </form>
    </section>
    <section class="card">
      <h2>Reset</h2>
      <p class="small">Changes you make are saved on this device. Reset puts everything back to the grades from your screenshots.</p>
      <button class="btn danger" onclick="resetAll()">Reset all data</button>
    </section>
  </div>`;
}

function notFound() {
  title.textContent = "Not found";
  return `<div class="page"><section class="card"><p>That page doesn't exist. <a href="#/">Go home</a></p></section></div>`;
}

/* ---------- Actions ---------- */
function setQuarter(q) { data.quarter = q; save(); render(); }
function toggleDay() { data.today = data.today === "A" ? "B" : "A"; save(); render(); }
function togglePill() { showSOE = !showSOE; render(); }
function setFilter(f) { dayFilter = f; render(); }
function setGrade(pd, form) {
  const c = byPd(pd), v = parseFloat(form.pct.value);
  if (isNaN(v)) return;
  c.grades[form.q.value] = v; save(); render();
}
function bump(pd, k, d) { const c = byPd(pd); c[k] = Math.max(0, c[k] + d); save(); render(); }
function addAssignment(pd, form) {
  byPd(pd).assignments.push({ name: form.name.value.trim(), earned: parseFloat(form.earned.value), possible: parseFloat(form.possible.value) });
  save(); render();
}
function delAssignment(pd, i) { byPd(pd).assignments.splice(i, 1); save(); render(); }
function addNews(form) {
  if (!data.myNews) data.myNews = [];
  data.myNews.push({ type: "Attendance", date: form.date.value, what: form.what.value, course: form.course.value });
  save(); render();
}
function delNews(i) { data.myNews.splice(i, 1); save(); render(); }
function saveInfo(form) { data.student.name = form.name.value.trim(); data.student.school = form.school.value.trim(); save(); location.hash = "#/"; }
function resetAll() {
  if (!confirm("Reset everything back to the original grades?")) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  data = JSON.parse(JSON.stringify(DEFAULT_DATA)); location.hash = "#/"; render();
}

// Forms are handled in JS instead of a real submit, because some previews
// (like sandboxed frames) block form submission entirely.
function submitForm(form) {
  if (!form.reportValidity()) return;
  const fn = window[form.dataset.action];
  form.dataset.pd ? fn(parseInt(form.dataset.pd, 10), form) : fn(form);
}
document.addEventListener("keydown", e => {
  const form = e.target.form;
  if (e.key === "Enter" && form && form.dataset.action && e.target.tagName === "INPUT") {
    e.preventDefault();
    submitForm(form);
  }
});
document.addEventListener("submit", e => e.preventDefault());

/* ---------- Router ---------- */
function renderPage() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const parts = hash.split("/").filter(Boolean);
  let html, nav = null;
  switch (parts[0]) {
    case undefined:    html = homePage(); nav = "home"; break;
    case "course":     html = coursePage(parseInt(parts[1], 10)); break;
    case "attendance": html = attendancePage(); break;
    case "planner":    html = placeholderPage("planner", "Planner"); break;
    case "news":       html = newsPage(); nav = "news"; break;
    case "links":      html = placeholderPage("", "Links"); nav = "links"; break;
    case "reports":    html = placeholderPage("reports", "Reports"); nav = "reports"; break;
    case "tests":      html = placeholderPage("tests", "Test History"); break;
    case "settings":   html = settingsPage(); break;
    default:           html = notFound();
  }
  view.innerHTML = html;
  document.title = title.textContent === "Overview" ? "My Grades" : title.textContent + " · My Grades";
  document.querySelectorAll(".bottomnav a").forEach(a =>
    a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}

// Re-rendering after a tap keeps your scroll position; changing pages jumps to the top
function render() { const y = window.scrollY; renderPage(); window.scrollTo(0, y); }
window.addEventListener("hashchange", () => {
  closeMenu();
  renderPage();
  window.scrollTo(0, 0);
  view.focus({ preventScroll: true });
});

/* ---------- Menu drawer ---------- */
const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim"), menuBtn = document.getElementById("menuBtn");
function openMenu() {
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false"); scrim.hidden = false;
  menuBtn.setAttribute("aria-expanded", "true"); drawer.querySelector("a").focus();
}
function closeMenu() {
  if (!drawer.classList.contains("open")) return;
  drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); scrim.hidden = true;
  menuBtn.setAttribute("aria-expanded", "false");
}
menuBtn.addEventListener("click", () => drawer.classList.contains("open") ? closeMenu() : openMenu());
scrim.addEventListener("click", closeMenu);
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); menuBtn.focus(); } });

render();
</script>
</body>
</html>
